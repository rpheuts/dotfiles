# ==============================================================================
# HYPRLOCK CONFIGURATION (ASUS Flow Z13 / Hyprland)
# ==============================================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/rpheuts/.config/quickshell/current_wallpaper
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# TIME (Large digital clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(240, 240, 240, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(200, 200, 200, 0.85)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# USERNAME
label {
    monitor =
    text = Robert Heuts
    color = rgba(220, 220, 220, 0.9)
    font_size = 16
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, -15
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(202, 204, 204, 0.6)
    inner_color = rgba(20, 20, 25, 0.5)
    font_color = rgb(240, 240, 240)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##aaaaaa">Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = rgba(202, 204, 204, 0.8)
    fail_color = rgba(255, 85, 85, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    capslock_color = rgba(255, 170, 0, 0.8)
    position = 0, -80
    halign = center
    valign = center
}
